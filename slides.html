    let currentTrack = 'n1';
    let currentSlide = 0;
    let showNotes = true;

    function renderSlide() {
      const deck = decks[currentTrack];
      const slide = deck[currentSlide];
      const container = document.getElementById('slide-container');
      
      container.innerHTML = `
        <div class="flex justify-between items-start border-b border-gray-800/80 pb-4 mb-4">
          <div>
            <h2 class="text-2xl sm:text-3xl font-black text-white tracking-tight">${slide.title}</h2>
            <p class="text-xs sm:text-sm text-teal-400 font-medium mt-0.5">${slide.subtitle}</p>
          </div>
          <span class="bg-gray-900 border border-gray-800 text-gray-400 text-xs px-2.5 py-1 rounded-md font-mono">
            ${currentSlide + 1} / ${deck.length}
          </span>
        </div>
        
        <div class="flex-1 flex flex-col justify-center py-2">
          ${slide.content}
        </div>
      `;

      document.getElementById('slide-notes').innerText = slide.notes;
      document.getElementById('slide-counter').innerText = `Slide ${currentSlide + 1} / ${deck.length}`;
    }

    function switchTrack(track) {
      currentTrack = track;
      currentSlide = 0;
      
      if (track === 'n1') {
        document.getElementById('btn-n1').className = "px-4 py-1.5 rounded-lg bg-teal-600 text-white transition";
        document.getElementById('btn-a1a2').className = "px-4 py-1.5 rounded-lg text-gray-400 hover:text-white transition";
      } else {
        document.getElementById('btn-a1a2').className = "px-4 py-1.5 rounded-lg bg-cyan-600 text-white transition";
        document.getElementById('btn-n1').className = "px-4 py-1.5 rounded-lg text-gray-400 hover:text-white transition";
      }
      renderSlide();
    }

    function nextSlide() {
      const deck = decks[currentTrack];
      if (currentSlide < deck.length - 1) {
        currentSlide++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }

    function toggleNotes() {
      showNotes = !showNotes;
      const drawer = document.getElementById('notes-drawer');
      const btn = document.getElementById('notes-btn-label');
      if (showNotes) {
        drawer.classList.remove('hidden');
        btn.innerText = "Hide Notes (N)";
      } else {
        drawer.classList.add('hidden');
        btn.innerText = "Show Notes (N)";
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'n' || e.key === 'N') {
        toggleNotes();
      }
    });

    // Initialize
    renderSlide();
  </script>
